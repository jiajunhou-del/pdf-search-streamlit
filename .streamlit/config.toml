# App-wide look and feel. This is the officially supported way to theme a
# Streamlit app (as opposed to hand-rolled CSS overrides of Streamlit's
# internal element classes, which tend to break across version upgrades) --
# so this is the first thing to touch when the app just needs to look nicer,
# and it will keep working across Streamlit updates.
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2440"
font = "sans serif"
 
